version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - cmake
    - doxygen
  jobs:
    pre_build:
      - cmake -S . -B docs/sphinx/_build -DOPERON_DOCS_ONLY=ON
      - cmake --build docs/sphinx/_build --target doxygen-xml

sphinx:
  configuration: docs/sphinx/conf.py

formats: all

python:
  install:
    - requirements: docs/requirements.txt
