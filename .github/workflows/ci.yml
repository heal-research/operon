name: Sanitizers and documentation

on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v27

    - name: Check formatting
      run: nix develop -c cmake -P cmake/lint.cmake

  sanitize:
    needs: [format]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v27

    - name: Configure
      run: >-
        nix develop -c cmake -S . -B build/sanitize -G "Unix Makefiles"
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
        -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
        -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
        -DUSE_SINGLE_PRECISION=ON
        -Doperon_DEVELOPER_MODE=ON

    - name: Build test binary
      run: nix develop -c cmake --build build/sanitize --target operon_test -j2

    - name: Test
      env:
        ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1:detect_leaks=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: nix develop -c ctest --test-dir build/sanitize --output-on-failure --no-tests=error -j2


  docs:
    needs: [sanitize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'heal-research'

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v27

    - name: Build docs
      run: >-
        nix develop -c cmake -S . -B build/docs -D BUILD_DOCS=ON
        && nix develop -c cmake --build build/docs --target docs

    - name: Deploy docs
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: build/docs/docs/html
